<header class="site-header">
    <div class="header-content">
        <a class="brand" href="{{ url_for('dashboard') }}" aria-label="Project Sentinel dashboard">
            <span class="brand-mark">S</span>
            <span>
                <strong>Project Sentinel</strong>
                <small>{% block nav_subtitle %}Network security monitoring and risk intelligence{% endblock %}</small>
            </span>
        </a>

        <nav class="main-navigation" aria-label="Primary navigation">
            <a href="{{ url_for('dashboard') }}"{% if request.endpoint == 'dashboard' %} class="active" aria-current="page"{% endif %}>Dashboard</a>
            <a href="{{ url_for('events_center') }}"{% if request.endpoint == 'events_center' %} class="active" aria-current="page"{% endif %}>Events</a>
            <a href="{{ url_for('changes_page') }}"{% if request.endpoint == 'changes_page' %} class="active" aria-current="page"{% endif %}>Changes</a>
            <a href="{{ url_for('exposures_page') }}"{% if request.endpoint == 'exposures_page' %} class="active" aria-current="page"{% endif %}>Exposures</a>
            <a href="{{ url_for('sensors_page') }}"{% if request.endpoint == 'sensors_page' %} class="active" aria-current="page"{% endif %}>Sensors</a>
            <a href="{{ url_for('sensor_events_page') }}"{% if request.endpoint == 'sensor_events_page' %} class="active" aria-current="page"{% endif %}>Detections</a>
            <a href="{{ url_for('assets_page') }}"{% if request.endpoint == 'assets_page' %} class="active" aria-current="page"{% endif %}>Assets</a>
            <a href="{{ url_for('devices') }}"{% if request.endpoint == 'devices' %} class="active" aria-current="page"{% endif %}>Devices JSON</a>
            <a href="{{ url_for('api_information') }}"{% if request.endpoint == 'api_information' %} class="active" aria-current="page"{% endif %}>API Index</a>
        </nav>

        <div class="live-indicator">
            <span class="live-dot" aria-hidden="true"></span>
            Sentinel API online
        </div>
    </div>
</header>
